name: Upstream Sync

# Automatically keeps this fork's `dev` branch in sync with rukamori/ArchiveTune `dev`.
# - Runs hourly, but does real work ONLY when upstream has new commits
#   (a no-change run is just a fetch + compare: ~30 seconds, no build).
# - Clean merges are pushed straight to dev (after a green debug-APK build).
# - Conflicts stop the run and report which files need a human; nothing is pushed.
#
# AI conflict resolution was removed: both providers it used are gone (NVIDIA NIM 401s without a
# key, GitHub Models returns 410 Gone), so every conflicted run failed at the resolver and this
# workflow had never once completed. See scripts/upstream_sync.sh for the details.
# Docs: docs/UPSTREAM_SYNC.md

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  # `models: read` dropped along with the AI resolver -- it existed only for the GitHub Models
  # fallback, and `pull-requests: write` went with the sync-PR step that no longer exists.

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  # This job adds an `upstream` remote pointing at rukamori/ArchiveTune, and gh resolves
  # an unqualified `gh pr`/`gh issue` against `upstream` in PREFERENCE to `origin`. That
  # silently opened PRs and "sync FAILED" issues on the UPSTREAM maintainer's repo instead
  # of this fork. GH_REPO pins every gh call in this workflow to the fork, including any
  # added later, so never remove it. Individual calls also pass --repo for clarity.
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      result: ${{ steps.sync.outputs.result }}
    steps:
      - name: Preflight secrets check
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          if [ -z "$SYNC_PAT" ]; then
            echo "::error::SYNC_PAT secret is not set. See docs/UPSTREAM_SYNC.md (Setup) for instructions."
            exit 1
          fi

      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Check for upstream changes
        id: check
        run: |
          git remote add upstream https://github.com/rukamori/ArchiveTune.git 2>/dev/null || true
          git fetch upstream dev --quiet
          BEHIND=$(git rev-list --count HEAD..upstream/dev)
          echo "dev is $BEHIND commit(s) behind upstream/dev"
          if [ "$BEHIND" -eq 0 ]; then
            echo "No upstream changes — skipping merge/build (no-op run)."
          fi
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"

      - name: Update submodules
        if: steps.check.outputs.behind != '0'
        run: git submodule update --init --recursive

      - name: Set up JDK 21
        if: steps.check.outputs.behind != '0'
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        if: steps.check.outputs.behind != '0'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Generate debug.keystore
        if: steps.check.outputs.behind != '0'
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run upstream sync
        if: steps.check.outputs.behind != '0'
        id: sync
        run: bash scripts/upstream_sync.sh
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}

      # The "Open sync PR" step that used to sit here is gone. It fired on result == 'ai' or
      # 'raced': 'ai' no longer exists, and 'raced' was never emitted by upstream_sync.sh at all,
      # so it was already unreachable. A genuine race (dev advancing mid-run) now surfaces as a
      # failed non-fast-forward push, reported by the failure step below.

      - name: Report successful sync
        if: steps.sync.outputs.result == 'clean'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          RESULT: ${{ steps.sync.outputs.result }}
          BEHIND: ${{ steps.sync.outputs.behind }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Upstream sync $(date +%Y-%m-%d): $BEHIND commits ($RESULT)" \
            --body-file /tmp/sync_report.md || \
            echo "::warning::Could not open the report issue (are Issues enabled on this repo?). Sync itself succeeded."

      - name: Report failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          {
            echo "## Upstream sync FAILED ($(date -u +%Y-%m-%dT%H:%MZ))"
            echo
            echo "The automated sync run failed and **no changes were pushed to dev**."
            echo
            echo "- Run logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- The rolling backup branch \`backup/dev-rolling\` points at dev as it was before this run."
            echo "- See docs/UPSTREAM_SYNC.md (Troubleshooting) for recovery steps."
          } > /tmp/sync_failure.md
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Upstream sync FAILED $(date +%Y-%m-%d)" \
            --body-file /tmp/sync_failure.md || \
            echo "::warning::Could not open the failure issue (are Issues enabled on this repo?). Check the run log."
