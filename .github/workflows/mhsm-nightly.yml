name: Mhsm Nightly

# Last updated: 2026-08-03 r4
# Produces the rolling "mhsm-nightly" pre-release used by the in-app updater's CANARY channel.
# Runs on every push to the 'Mhsm' branch (and on demand). The updater looks for a GitHub release
# with tag "mhsm-nightly" and compares the at-build:<n> marker in its body against the installed
# versionCode to decide whether a newer build is available.
on:
  push:
    branches:
      - Mhsm
  workflow_dispatch:
    inputs:
      force:
        description: Build even if there are no new commits since the last build
        type: boolean
        default: false

concurrency:
  group: mhsm-nightly
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      nightly_tag: ${{ steps.decide.outputs.nightly_tag }}
      nightly_name: ${{ steps.decide.outputs.nightly_name }}
      version_name: ${{ steps.decide.outputs.version_name }}
      version_code: ${{ steps.decide.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail

          NIGHTLY_TAG="mhsm-nightly"
          BASE_VERSION="$(grep -oP 'baseVersionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo '0.0.0')"
          MAJOR_MINOR="$(echo "$BASE_VERSION" | cut -d. -f1-2)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          TS="$(date -u +'%Y%m%d%H%M')"

          RELEASES_JSON="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" > "$RELEASES_JSON" 2>/dev/null || echo '[]' > "$RELEASES_JSON"
          PUBLISHED_MAX="$(
            {
              jq -r '.[].body // ""' "$RELEASES_JSON" | grep -oE 'at-build:[0-9]+' | cut -d: -f2
              jq -r '.[].tag_name' "$RELEASES_JSON" | grep -oE '^v?[0-9]+\.[0-9]+\.[0-9]+$' | awk -F. '{print $NF}'
            } 2>/dev/null | sort -n | tail -1
          )"
          rm -f "$RELEASES_JSON"

          VERSION_CODE="$COMMIT_COUNT"
          if [ -n "${PUBLISHED_MAX:-}" ] && [ "$PUBLISHED_MAX" -ge "$COMMIT_COUNT" ]; then
            VERSION_CODE="$((PUBLISHED_MAX + 1))"
            echo "versionCode floor: published ${PUBLISHED_MAX} >= count ${COMMIT_COUNT}, using ${VERSION_CODE}"
          fi

          echo "nightly_tag=${NIGHTLY_TAG}" >> "$GITHUB_OUTPUT"
          echo "nightly_name=Mhsm Nightly ${MAJOR_MINOR}.${VERSION_CODE}-${SHORT_SHA} (${TS})" >> "$GITHUB_OUTPUT"
          echo "version_name=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

          if [ "${FORCE:-false}" = "true" ]; then
            echo "Forced build requested."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_NIGHTLY_SHA="$(gh release view mhsm-nightly \
            --repo "$GITHUB_REPOSITORY" \
            --json targetCommitish \
            --jq '.targetCommitish' 2>/dev/null || true)"

          if [ -z "${LAST_NIGHTLY_SHA:-}" ] || [ "$LAST_NIGHTLY_SHA" = "null" ]; then
            echo "No previous mhsm-nightly release found; building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git cat-file -e "${LAST_NIGHTLY_SHA}^{commit}" 2>/dev/null; then
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse "${LAST_NIGHTLY_SHA}^{commit}")" ]; then
              echo "No new commits since last mhsm-nightly; skipping."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "New commits since last mhsm-nightly; building."
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build Mhsm Nightly APKs
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION_NAME_OVERRIDE: ${{ needs.check.outputs.version_name }}
      VERSION_CODE_OVERRIDE: ${{ needs.check.outputs.version_code }}
      NIGHTLY_BUILD_HASH: ${{ github.sha }}
      IS_NIGHTLY_BUILD: 'true'
    strategy:
      matrix:
        include:
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: arm64
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: armeabi
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: x86
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: x86_64
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: universal
          - device: tv
            distribution: gms
            distributionName: Gms
            deviceName: Tv
            abi: universal
          - device: mobile
            distribution: foss
            distributionName: Foss
            deviceName: Mobile
            abi: universal

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve variant names
        id: variant
        shell: bash
        run: |
          set -euo pipefail
          DISTRIBUTION="${{ matrix.distribution }}"
          DISTRIBUTION_CAP="${{ matrix.distributionName }}"
          DEVICE="${{ matrix.device }}"
          ABI="${{ matrix.abi }}"
          DEVICE_CAP="${{ matrix.deviceName }}"
          ABI_CAP="$(tr '[:lower:]' '[:upper:]' <<< "${ABI:0:1}")${ABI:1}"
          echo "distribution=$DISTRIBUTION" >> "$GITHUB_OUTPUT"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "abi=$ABI" >> "$GITHUB_OUTPUT"
          echo "device_cap=$DEVICE_CAP" >> "$GITHUB_OUTPUT"
          echo "abi_cap=$ABI_CAP" >> "$GITHUB_OUTPUT"
          echo "gradle_task=assemble${DISTRIBUTION_CAP}${DEVICE_CAP}${ABI_CAP}Release" >> "$GITHUB_OUTPUT"
          echo "artifact_name=app-${DISTRIBUTION}-${DEVICE}-${ABI}-nightly" >> "$GITHUB_OUTPUT"
          echo "apk_name=app-${DISTRIBUTION}-${DEVICE}-${ABI}-nightly.apk" >> "$GITHUB_OUTPUT"

      - name: Prepare signing keystore
        shell: bash
        env:
          MHSM_KEYSTORE_BASE64: ${{ secrets.MHSM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${MHSM_KEYSTORE_BASE64:-}" ]; then
            mkdir -p app/keystore
            echo "$MHSM_KEYSTORE_BASE64" | base64 -d > app/keystore/mhsm.keystore
          fi

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_TASK="${{ steps.variant.outputs.gradle_task }}"
          ABI="${{ matrix.abi }}"
          if [ "$ABI" = "armeabi" ] || [ "$ABI" = "x86" ]; then
            ./gradlew "$GRADLE_TASK" 2>&1 | python3 -c "import re,sys;p=re.compile(r'^(WARNING: )?\[CXX5202\] This app only has 32-bit \[(armeabi-v7a|x86)\] native libraries\. Beginning August 1, 2019 Google Play store requires that all apps that include native libraries must provide 64-bit versions\. For more information, visit https://g\.co/64-bit-requirement\$');[sys.stdout.write(l) for l in sys.stdin if not p.match(l.rstrip())]"
          else
            ./gradlew "$GRADLE_TASK"
          fi
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          MHSM_KEYSTORE_PASSWORD: ${{ secrets.MHSM_KEYSTORE_PASSWORD }}
          MHSM_KEY_ALIAS: ${{ secrets.MHSM_KEY_ALIAS }}
          MHSM_KEY_PASSWORD: ${{ secrets.MHSM_KEY_PASSWORD }}

      - name: Resolve APK output directory
        id: release_dir
        shell: bash
        run: |
          set -euo pipefail
          DISTRIBUTION="${{ steps.variant.outputs.distribution }}"
          DEVICE="${{ steps.variant.outputs.device }}"
          ABI="${{ steps.variant.outputs.abi }}"
          DEVICE_CAP="${{ steps.variant.outputs.device_cap }}"
          ABI_CAP="${{ steps.variant.outputs.abi_cap }}"
          CANDIDATES=(
            "app/build/outputs/apk/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/gms${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/gms${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/gms/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/gms/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/gms/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${ABI}/${DEVICE}/release"
          )
          for d in "${CANDIDATES[@]}"; do
            if [ -d "$d" ]; then
              echo "release_dir=$d" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          FOUND_METADATA="$(
            find app/build/outputs/apk -type f -name "output-metadata.json" \
              \( \
                -path "*/${DISTRIBUTION}/${DEVICE}/${ABI}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DEVICE}/${ABI}/release/output-metadata.json" -o \
                -path "*/${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" \
              \) \
              | head -n 1 || true
          )"
          if [ -n "${FOUND_METADATA:-}" ]; then
            echo "release_dir=$(dirname "$FOUND_METADATA")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Could not resolve APK release output directory for DISTRIBUTION=$DISTRIBUTION DEVICE=$DEVICE ABI=$ABI"
          find app/build/outputs/apk -maxdepth 8 -type d -print || true
          exit 1

      - name: Prepare signing key
        id: signing
        shell: bash
        env:
          MHSM_KEYSTORE_BASE64: ${{ secrets.MHSM_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${MHSM_KEYSTORE_BASE64:-}" ]; then
            echo "mode=secret" >> "$GITHUB_OUTPUT"
          else
            FIXED_KEYSTORE="$GITHUB_WORKSPACE/app/persistent-debug.keystore"
            if [ ! -f "$FIXED_KEYSTORE" ]; then
              echo "::error::No MHSM_KEYSTORE_BASE64 secret and no fallback keystore at $FIXED_KEYSTORE"
              exit 1
            fi
            echo "::notice::No MHSM_KEYSTORE_BASE64 set — signing with the fixed debug keystore."
            {
              echo "mode=test"
              echo "signing_key=$(base64 -w0 "$FIXED_KEYSTORE")"
              echo "alias=androiddebugkey"
              echo "store_pass=android"
              echo "key_pass=android"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Sign APK (MHSM keystore)
        if: steps.signing.outputs.mode == 'secret'
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: ${{ steps.release_dir.outputs.release_dir }}/
          signingKey: ${{ secrets.MHSM_KEYSTORE_BASE64 }}
          keyAlias: ${{ secrets.MHSM_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.MHSM_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.MHSM_KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Sign APK (fixed debug keystore)
        if: steps.signing.outputs.mode == 'test'
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: ${{ steps.release_dir.outputs.release_dir }}/
          signingKey: ${{ steps.signing.outputs.signing_key }}
          keyAlias: ${{ steps.signing.outputs.alias }}
          keyStorePassword: ${{ steps.signing.outputs.store_pass }}
          keyPassword: ${{ steps.signing.outputs.key_pass }}
          buildToolsVersion: 35.0.0

      - name: Move and rename APK
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="${{ steps.release_dir.outputs.release_dir }}"
          mkdir -p "$RELEASE_DIR/out"
          mapfile -t SIGNED_APKS < <(
            find "$RELEASE_DIR" -maxdepth 1 -type f \
              \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \)
          )
          if [ "${#SIGNED_APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one signed APK in $RELEASE_DIR, found ${#SIGNED_APKS[@]}"
            find "$RELEASE_DIR" -maxdepth 2 -type f -print || true
            exit 1
          fi
          APK="${SIGNED_APKS[0]}"
          mv "$APK" "$RELEASE_DIR/out/${{ steps.variant.outputs.apk_name }}"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.variant.outputs.artifact_name }}
          path: ${{ steps.release_dir.outputs.release_dir }}/out/${{ steps.variant.outputs.apk_name }}

  create-nightly:
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all APKs
        uses: actions/download-artifact@v8
        with:
          path: downloaded_artifacts/

      - name: Build changelog
        id: changelog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ needs.check.outputs.version_code }}
        run: |
          set -euo pipefail
          LAST_SHA="$(gh release view mhsm-nightly \
            --repo "$GITHUB_REPOSITORY" \
            --json targetCommitish \
            --jq '.targetCommitish' 2>/dev/null || true)"
          {
            echo "# Mhsm Nightly"
            echo ""
            echo "Automated nightly build from the \`Mhsm\` branch."
            echo ""
            echo "<!-- at-build:${VERSION_CODE} -->"
            echo ""
            echo "## Changes"
          } > nightly_notes.md
          if [ -n "${LAST_SHA:-}" ] && [ "$LAST_SHA" != "null" ] && \
             git cat-file -e "${LAST_SHA}^{commit}" 2>/dev/null; then
            git log --pretty=format:'- %s (%h)' "${LAST_SHA}..HEAD" >> nightly_notes.md || true
          else
            git log --pretty=format:'- %s (%h)' -n 30 >> nightly_notes.md || true
          fi
          echo "" >> nightly_notes.md

      - name: Delete previous mhsm-nightly release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh release delete mhsm-nightly \
            --repo "$GITHUB_REPOSITORY" \
            --cleanup-tag \
            --yes 2>/dev/null || true

      - name: Create rolling mhsm-nightly release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          NIGHTLY_TAG: ${{ needs.check.outputs.nightly_tag }}
          NIGHTLY_NAME: ${{ needs.check.outputs.nightly_name }}
        run: |
          set -euo pipefail
          MOBILE_UNIVERSAL_APK="$(find downloaded_artifacts/app-gms-mobile-universal-nightly -name '*.apk' | head -n 1)"
          OTHER_APKS="$(find downloaded_artifacts -path '*/app-*-nightly/*.apk' ! -path '*/app-gms-mobile-universal-nightly/*')"
          gh release create "$NIGHTLY_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            --title "$NIGHTLY_NAME" \
            --notes-file nightly_notes.md \
            --prerelease \
            "$MOBILE_UNIVERSAL_APK" \
            $OTHER_APKS

      - name: Notify Telegram channel
        continue-on-error: true
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          APK_PATH: downloaded_artifacts/app-gms-mobile-universal-nightly
        run: |
          pip install telethon --quiet
          python3 .github/workflows/deploy_artifacts.py || true

      - name: Post build summary to Telegram
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: |
          pip install telethon --quiet
          python3 .github/workflows/notify_telegram.py || true
